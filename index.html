<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex, nofollow">
<title>Lucy Lima | Acesso</title>

<style>
  /* --- CSS CRÍTICO INLINE PARA CARREGAMENTO INSTANTÂNEO --- */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    background-color: #000000;
    color: #FFFFFF;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  /* A interface começa escondida para permitir o redirecionamento imediato */
  .ui-container {
    display: none; /* O JS vai mudar para flex se o redirecionamento falhar */
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 1.5rem;
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
    text-align: center;
    opacity: 0;
    transition: opacity 0.4s ease;
  }

  .ui-container.visible {
    display: flex;
    opacity: 1;
  }

  .name {
    font-size: 2.4rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    margin-bottom: 1.5rem;
    display: flex;
    gap: 8px;
    justify-content: center;
  }

  .name-white { color: #FFFFFF; }
  .name-blue { color: #3B82F6; }

  .card {
    background-color: #1C1C1E;
    width: 100%;
    border-radius: 36px;
    padding: 2.5rem 1.5rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  }

  .avatar-wrapper {
    width: 150px;
    height: 150px;
    margin-bottom: 2rem;
    position: relative;
  }

  .avatar {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid #FFFFFF;
  }

  .avatar-fallback {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 4px solid #FFFFFF;
    background-color: #3B82F6;
    color: #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3.5rem;
    font-weight: 700;
  }

  .btn-access {
    width: 100%;
    padding: 1.25rem 1rem;
    background-color: #22C55E;
    color: #FFFFFF;
    border: none;
    border-radius: 50px;
    font-size: 1.15rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    line-height: 1.3;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 0 25px rgba(34, 197, 94, 0.5);
    -webkit-tap-highlight-color: transparent;
  }

  .btn-access:hover {
    background-color: #4ADE80;
    transform: translateY(-2px);
    box-shadow: 0 0 35px rgba(34, 197, 94, 0.7);
  }

  .btn-access:active {
    transform: translateY(1px);
    box-shadow: 0 0 15px rgba(34, 197, 94, 0.4);
  }

  .footer {
    margin-top: 2.5rem;
    color: #555555;
    font-size: 0.85rem;
    font-weight: 500;
  }
</style>

<script>
  // --- MOTOR DE REDIRECIONAMENTO E SEGURANÇA (EXECUTA IMEDIATAMENTE) ---
  (function() {
    'use strict';

    var DEST = 'https://linktr.ee/lucysafadinha';
    var ua = navigator.userAgent || '';
    var uaLower = ua.toLowerCase();

    // 1. Bloqueio de bots (Meta, LinkedIn, Twitter, etc.)
    var BOT_PATTERNS = [
      'facebookexternalhit', 'facebot', 'meta-externalagent',
      'meta-externalfetcher', 'linkedinbot', 'twitterbot',
      'whatsapp', 'slackbot', 'telegrambot', 'discordbot'
    ];
    
    var isBot = BOT_PATTERNS.some(function(p) { return uaLower.indexOf(p) !== -1; });

    if (isBot) {
      // Se for bot, aniquila o body e o title para não indexar nada
      document.addEventListener('DOMContentLoaded', function () {
        document.body.innerHTML = '';
        document.title = 'Lucy Lima';
      });
      return;
    }

    // 2. Função de Redirecionamento
    function redirect() {
      var isIAB = /IABMobile|Instagram|FBAN|FBAV|Twitter/i.test(ua);

      if (isIAB) {
        // Android: Tenta abrir no Chrome via intent
        if (/Android/i.test(ua)) {
          try {
            window.location.href = 'intent://' + DEST.replace(/^https?:\/\//, '') + 
              '#Intent;scheme=https;package=com.android.chrome;end';
          } catch(e) {}
        } 
        // iOS: No Instagram/Facebook, o location.href costuma ser bloqueado. 
        // A melhor tentativa é o replace ou abrir em nova aba.
        else if (/iPhone|iPad|iPod/i.test(ua)) {
          window.location.replace(DEST);
        }
      } else {
        // Navegadores normais: Substitui a página atual no histórico (sem botão voltar)
        window.location.replace(DEST);
      }
    }

    // 3. Dispara o redirecionamento IMEDIATAMENTE
    redirect();

    // 4. FALLBACK: Se após 1.5s o usuário ainda estiver na página, mostra o botão.
    setTimeout(function() {
      // Se a página ainda estiver visível e o usuário não saiu
      if (document.visibilityState === 'visible' || !document.hidden) {
        
        var ui = document.getElementById('fallback-ui');
        if (ui) {
          ui.classList.add('visible');
        }

        // Ativa o botão manual
        var btn = document.getElementById('access-btn');
        if (btn) {
          btn.addEventListener('click', function(e) {
            e.preventDefault();
            window.location.href = DEST;
          });
        }
      }
    }, 1500); // 1.5 segundos é o tempo de segurança ideal
  })();
</script>
</head>
<body>

  <!-- Interface só aparece se o redirecionamento automático falhar -->
  <main id="fallback-ui" class="ui-container">
    
    <h1 class="name">
      <span class="name-white">Lucy</span>
      <span class="name-blue">Lima</span>
    </h1>

    <div class="card">
      <div class="avatar-wrapper">
        <img class="avatar" src="imgs/lucy.jpg" alt="Lucy Lima"
             onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
        <div class="avatar-fallback" style="display:none;">L</div>
      </div>

      <button id="access-btn" class="btn-access" type="button">
        Clique aqui para<br>acessar
      </button>
    </div>

    <footer class="footer">
      Lucy Lima &copy; 2026. All rights reserved.
    </footer>
  </main>

</body>
</html>
